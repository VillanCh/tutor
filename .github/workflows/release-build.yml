name: Native release packages
on:
  push:
    branches: ['codex/release-*']
  workflow_dispatch:
permissions:
  # GitHub requires repository write access to read unpublished Release drafts.
  contents: write
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: macos-15-intel
            platform: macOS-x64
          - os: macos-15
            platform: macOS-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Download native Electron runtime
        run: node node_modules/electron/install.js
      - name: Download compiled UI from release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          gh release download "v$VERSION" --pattern "tutor-ui-v$VERSION.zip" --output tutor-ui.zip
          mkdir -p dist/ui
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -Command 'Expand-Archive -Path tutor-ui.zip -DestinationPath dist/ui'
          else
            unzip -q tutor-ui.zip -d dist/ui
          fi
      - name: Syntax and regression tests
        run: |
          npm run check
          npm test
      - name: Prepare macOS build tools
        if: runner.os == 'macOS'
        run: brew install pkgconf
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
      - uses: actions/cache/restore@v4
        if: runner.os == 'macOS'
        id: media-cache
        with:
          path: |
            build/generated/mac-media
            build/generated/media-sources
          key: media-${{ matrix.platform }}-${{ hashFiles('scripts/build-mac-media.cjs') }}
      - name: Compile redistributable macOS media tools
        if: runner.os == 'macOS'
        run: node scripts/build-mac-media.cjs
      - uses: actions/cache/save@v4
        if: runner.os == 'macOS' && steps.media-cache.outputs.cache-hit != 'true'
        with:
          path: |
            build/generated/mac-media
            build/generated/media-sources
          key: ${{ steps.media-cache.outputs.cache-primary-key }}
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '10.0.x'
      - name: Install pinned Azure Key Vault signing tool
        if: runner.os == 'Windows'
        run: dotnet tool install --global AzureSignTool --version 7.0.1
      - name: Sign, notarize and verify macOS distribution
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ACCOUNT_EMAIL }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/release.cjs --prebuilt-ui
      - name: Sign and verify Windows distribution
        if: runner.os == 'Windows'
        env:
          WINDOWS_CODE_SIGN_CERT_NAME: ${{ secrets.WINDOWS_CODE_SIGN_CERT_NAME }}
          WINDOWS_CODE_SIGN_CLIENT_ID: ${{ secrets.WINDOWS_CODE_SIGN_CLIENT_ID }}
          WINDOWS_CODE_SIGN_CLIENT_SECRET: ${{ secrets.WINDOWS_CODE_SIGN_CLIENT_SECRET }}
          WINDOWS_CODE_SIGN_KEY_VAULT_URI: ${{ secrets.WINDOWS_CODE_SIGN_KEY_VAULT_URI }}
          WINDOWS_CODE_SIGN_TENANT_ID: ${{ secrets.WINDOWS_CODE_SIGN_TENANT_ID }}
        run: node scripts/release.cjs --prebuilt-ui
      - name: Upload verified packages to release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/upload-release.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tutor-${{ matrix.platform }}
          if-no-files-found: warn
          path: |
            release/verification-*.json
            release/SHA256SUMS-*.txt
            release/notarization-*.json
